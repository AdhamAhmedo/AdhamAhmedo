<svg width="90" height="90" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .float2 { animation: floatY2 3.4s ease-in-out infinite; animation-delay: 0.6s; transform-origin: 50px 50px; }
    @keyframes floatY2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
  </style>
  <g class="float2">
    <circle cx="50" cy="50" r="35" fill="none" stroke="#F5A623" stroke-width="5"/>
    <circle cx="50" cy="50" r="6" fill="#F5A623"/>
    <line x1="50" y1="5" x2="50" y2="25" stroke="#F5A623" stroke-width="5"/>
    <line x1="50" y1="75" x2="50" y2="95" stroke="#F5A623" stroke-width="5"/>
    <line x1="5" y1="50" x2="25" y2="50" stroke="#F5A623" stroke-width="5"/>
    <line x1="75" y1="50" x2="95" y2="50" stroke="#F5A623" stroke-width="5"/>
  </g>
</svg>
